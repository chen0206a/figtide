<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#1F4FB8;text-decoration:none}
button,input{font-family:inherit}
.dock-in{animation:dockIn .5s cubic-bezier(.22,1,.36,1) both}
@keyframes dockIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.msg-in{animation:msgIn .45s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0ms)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.shimmer{background:linear-gradient(90deg,#EEF0F3 0%,#F8F9FB 40%,#EEF0F3 80%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.ring{stroke-dasharray:5 4;animation:ringMove 1.2s linear infinite, ringPulse 1.6s ease-in-out infinite}
@keyframes ringMove{to{stroke-dashoffset:-18}}
@keyframes ringPulse{0%,100%{opacity:.95}50%{opacity:.45}}
.glow{animation:glowPulse 1.6s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.28}50%{opacity:.1}}
.pill{transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s}
.pill:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(14,17,22,.55)}
.star{transform-box:fill-box;transform-origin:center;animation:starSpin 6s ease-in-out infinite}
@keyframes starSpin{0%,80%,100%{transform:rotate(0) scale(1)}88%{transform:rotate(90deg) scale(1.15)}}
.ask-in{animation:askIn .5s cubic-bezier(.22,1,.36,1) both}
@keyframes askIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.toast-in{animation:toastIn .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

</head>
<body>


<div style="height: 940px; display: flex; flex-direction: column; background: #F5F6F8; color: #0E1116; font-family: Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 13px; line-height: 1.5; overflow: hidden">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 60px; padding: 8px 20px; background: #FFFFFF; border-bottom: 1px solid #E4E7EC">
<span style="width: 30px; height: 30px; border-radius: 8px; background: #0E1116; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18 L9 11 L13 14 L20 5"></path></svg></span>
<span style="display: flex; flex-direction: column; flex: 1 1 240px; min-width: 0"><span style="font-size: 16px; font-weight: 600">Learning dynamics</span><span style="font-size: 12px; color: #5F6773">视觉模型泛化研究 › <span style="font-family: 'JetBrains Mono', monospace">图版 04</span> · 已保存 v3</span></span>
<button type="button" aria-label="数据栏" aria-pressed="true" style="width: 34px; height: 34px; border: 0; border-radius: 8px; background: #F1F3F6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E1116" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4 V20"></path></svg></button>
<button type="button" style="height: 34px; padding: 0 10px; border: 0; background: transparent; font-size: 13px">快捷操作</button>
<button type="button" class="pill" aria-controls="assistant-dock" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 10px; border: 0; border-radius: 999px; background: #0E1116; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer; outline: none; outline-offset: 2px">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path class="star" d="M12 2 L13.8 9.2 L21 11 L13.8 12.8 L12 20 L10.2 12.8 L3 11 L10.2 9.2 Z" fill="#FFFFFF"></path></svg>
绘图助手
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 1px 5px; border-radius: 4px; background: #2B323C; color: #B8C0CC">⌘J</span>
</button>
<button type="button" style="height: 34px; padding: 0 10px; border: 0; background: transparent; font-size: 13px">复用</button>
<span style="width: 1px; height: 20px; background: #E4E7EC"></span>
<button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #D5DAE1; border-radius: 9px; background: #FFFFFF; font-size: 13px">保存</button>
<button type="button" style="height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: #0E1116; color: #FFFFFF; font-size: 13px; font-weight: 600">导出</button>
</div>

<div style="flex: 1; display: flex; min-height: 0">

<aside aria-label="数据与图层" style="width: 220px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E4E7EC; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<strong>数据与图层</strong>
<span style="display: flex; justify-content: space-between; height: 34px; align-items: center; padding: 0 10px; border: 1px solid #E4E7EC; border-radius: 8px">curves.csv<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5F6773">v1</span></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5F6773">12 行 · 5 字段</span>
<span style="margin-top: 8px; font-weight: 600">图层 / 序列</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 14px; height: 2px; background: #0072B2"></span>Baseline</span>
<span style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 0 -8px; border-radius: 7px; background: transparent"><span style="width: 14px; height: 3px; background: #D55E00"></span>Proposed method</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 14px; border-top: 2px dashed #009E73"></span>Without module A</span>
</aside>

<section aria-label="画布" style="flex: 1; min-width: 0; position: relative; background: #F0F1F4; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 32px 120px">




<div style="width: 100%; max-width: 740px; background: #FFFFFF; padding: 12px 14px 6px; box-shadow: 0 1px 2px rgba(14,17,22,0.08), 0 30px 60px -30px rgba(14,17,22,0.25)">
<svg viewBox="0 0 700 360" style="display: block; width: 100%; height: auto; overflow: visible" role="img" aria-label="学习曲线，图例位于顶部">
<g font-family="Inter, sans-serif" fill="#5F6773">
<g transform="translate(62,40)">
<g stroke="#EDEFF2"><line x1="0" y1="0" x2="620" y2="0"></line><line x1="0" y1="56" x2="620" y2="56"></line><line x1="0" y1="112" x2="620" y2="112"></line><line x1="0" y1="168" x2="620" y2="168"></line><line x1="0" y1="224" x2="620" y2="224"></line></g>
<line x1="0" y1="280" x2="620" y2="280" stroke="#2B323C"></line><line x1="0" y1="0" x2="0" y2="280" stroke="#2B323C"></line>
<g text-anchor="end" style="font-size: 11px; transition: font-size .6s cubic-bezier(.22,1,.36,1)"><text x="-10" y="4">100</text><text x="-10" y="60">90</text><text x="-10" y="116">80</text><text x="-10" y="172">70</text><text x="-10" y="228">60</text><text x="-10" y="284">50</text></g>
<g text-anchor="middle" style="font-size: 11px; transition: font-size .6s cubic-bezier(.22,1,.36,1)"><text x="0" y="300">0</text><text x="103.3" y="300">10</text><text x="206.7" y="300">20</text><text x="310" y="300">30</text><text x="413.3" y="300">40</text><text x="516.7" y="300">50</text><text x="620" y="300">60</text></g>
<text x="310" y="318" text-anchor="middle" font-size="12" fill="#2B323C">Training epoch</text>
<text transform="translate(-46,140) rotate(-90)" text-anchor="middle" font-size="12" fill="#2B323C">Test accuracy (%)</text>
<path d="M0.0,205.0 L51.7,131.7 L103.3,89.0 L155.0,64.3 L206.7,50.0 L258.3,41.8 L310.0,37.1 L361.7,34.4 L413.3,33.0 L465.0,32.1 L516.7,31.7 L568.3,31.5 L620.0,31.4 L620.0,50.0 L568.3,50.3 L516.7,50.9 L465.0,51.9 L413.3,53.4 L361.7,55.8 L310.0,59.8 L258.3,66.4 L206.7,77.3 L155.0,95.4 L103.3,125.3 L51.7,175.3 L0.0,258.7 Z" fill="#D55E00" fill-opacity="0.12"></path>
<path d="M0.0,242.1 L51.7,175.9 L103.3,137.9 L155.0,116.1 L206.7,103.6 L258.3,96.5 L310.0,92.3 L361.7,90.0 L413.3,88.6 L465.0,87.8 L516.7,87.4 L568.3,87.1 L620.0,87.0" fill="none" stroke="#009E73" stroke-width="2" stroke-dasharray="6 4"></path>
<path d="M0.0,238.2 L51.7,167.7 L103.3,127.2 L155.0,104.0 L206.7,90.7 L258.3,83.1 L310.0,78.7 L361.7,76.2 L413.3,74.7 L465.0,73.9 L516.7,73.4 L568.3,73.2 L620.0,73.0" fill="none" stroke="#0072B2" stroke-width="2"></path>

<path d="M0.0,231.9 L51.7,153.5 L103.3,107.2 L155.0,79.8 L206.7,63.7 L258.3,54.1 L310.0,48.5 L361.7,45.1 L413.3,43.2 L465.0,42.0 L516.7,41.3 L568.3,40.9 L620.0,40.7" fill="none" stroke="#D55E00" style="stroke-width: 2.8px; transition: stroke-width .6s cubic-bezier(.22,1,.36,1)"></path>

</g>
<rect x="500" y="220" width="168" height="72" rx="6" fill="#FFFFFF" stroke="#E4E7EC" style="opacity: 0; transition: opacity .5s ease, x .7s, y .7s"></rect>

<g style="transform: translate(178px, 22px); transition: transform .75s cubic-bezier(.22,1,.36,1)" font-size="12" fill="#2B323C"><line x1="0" y1="-4" x2="20" y2="-4" stroke="#0072B2" stroke-width="2"></line><text x="26" y="0">Baseline</text></g>
<g style="transform: translate(290px, 22px); transition: transform .75s cubic-bezier(.22,1,.36,1) 60ms" font-size="12" fill="#2B323C"><line x1="0" y1="-4" x2="20" y2="-4" stroke="#D55E00" style="stroke-width: 2.8px; transition: stroke-width .6s"></line><text x="26" y="0">Proposed method</text></g>
<g style="transform: translate(442px, 22px); transition: transform .75s cubic-bezier(.22,1,.36,1) 120ms" font-size="12" fill="#2B323C"><line x1="0" y1="-4" x2="20" y2="-4" stroke="#009E73" stroke-width="2" stroke-dasharray="5 3"></line><text x="26" y="0">Without module A</text></g>
</g>
</svg>
</div>


<div class="ask-in" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(640px, calc(100% - 48px)); display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center">

<button type="button" style="height: 30px; padding: 0 12px; border: 1px solid #D5DAE1; border-radius: 999px; background: #FFFFFF; color: #2B323C; font-size: 12px; cursor: pointer">图例放到右下角，Proposed 加粗</button>

<button type="button" style="height: 30px; padding: 0 12px; border: 1px solid #D5DAE1; border-radius: 999px; background: #FFFFFF; color: #2B323C; font-size: 12px; cursor: pointer">坐标轴字号改为 13</button>

<button type="button" style="height: 30px; padding: 0 12px; border: 1px solid #D5DAE1; border-radius: 999px; background: #FFFFFF; color: #2B323C; font-size: 12px; cursor: pointer">隐藏网格线</button>

</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 10px 8px 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E7EC; box-shadow: 0 24px 48px -22px rgba(14,17,22,0.4)">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path class="star" d="M12 2 L13.8 9.2 L21 11 L13.8 12.8 L12 20 L10.2 12.8 L3 11 L10.2 9.2 Z" fill="#0E1116"></path></svg>
<input type="text" aria-label="描述想怎么改这张图" value="" placeholder="描述你想怎么改这张图，先预览再应用…" style="flex: 1; min-width: 0; height: 36px; border: 0; outline: none; font-size: 14px; background: transparent; color: #0E1116">
<button type="button" disabled aria-label="生成调整提案" style="width: 38px; height: 38px; border: 0; border-radius: 11px; background: #C3C9D2; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19 V5"></path><path d="M6 11 L12 5 L18 11"></path></svg></button>
</div>
<label style="display: flex; align-items: center; gap: 8px; color: #5F6773; font-size: 12px; cursor: pointer"><input type="checkbox" style="accent-color: #0E1116"> 允许发送图表配置和字段摘要（不含原始数据行，模型服务可能计费）</label>
</div>
</div>

</section>




<aside aria-label="属性" style="width: 280px; flex-shrink: 0; background: #FFFFFF; border-left: 1px solid #E4E7EC; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<strong>属性</strong>
<span style="color: #5F6773">图表 · 外观 · 序列 · 坐标轴 · 注释 · 专业</span>
<span style="display: flex; justify-content: space-between; height: 34px; align-items: center; padding: 0 10px; border: 1px solid #E4E7EC; border-radius: 8px">X 轴 <span style="font-family: 'JetBrains Mono', monospace">epoch</span></span>
<span style="display: flex; justify-content: space-between; height: 34px; align-items: center; padding: 0 10px; border: 1px solid #E4E7EC; border-radius: 8px">Y 轴 <span style="font-family: 'JetBrains Mono', monospace">accuracy</span></span>
<span style="display: flex; justify-content: space-between; height: 34px; align-items: center; padding: 0 10px; border: 1px solid #E4E7EC; border-radius: 8px">按类别分组 <span>不分组</span></span>
</aside>


</div>
</div>

</body>
</html>
