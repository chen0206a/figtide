name: Windows desktop package
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mcp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check version and trigger
        run: |
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match the source version vX.Y.Z.' }
          "FIGTIDE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test source
        env:
          LABFLOW_TEST_DB: h2
        run: |
          npm ci --prefix frontend
          if ($LASTEXITCODE) { throw 'npm ci failed' }
          npm ci --prefix mcp
          if ($LASTEXITCODE) { throw 'MCP npm ci failed' }
          npm --prefix mcp run check
          if ($LASTEXITCODE) { throw 'MCP type check failed' }
          npm --prefix mcp test
          if ($LASTEXITCODE) { throw 'MCP unit tests failed' }
          npm --prefix mcp run build
          if ($LASTEXITCODE) { throw 'MCP build failed' }
          npm --prefix frontend test -- --maxWorkers=2
          if ($LASTEXITCODE) { throw 'Frontend tests failed' }
          node --test scripts/migration/*.test.cjs
          if ($LASTEXITCODE) { throw 'Migration tests failed' }
          node --test scripts/desktop/*.test.cjs
          if ($LASTEXITCODE) { throw 'Desktop probe diagnostic tests failed' }
          mvn -B -f backend/pom.xml verify
          if ($LASTEXITCODE) { throw 'H2 tests failed' }
      - name: Build portable application
        run: ./scripts/package-desktop.ps1
      - name: Test MCP through stdio against desktop JAR
        env:
          FIGTIDE_DESKTOP_JAR: ${{ github.workspace }}\.runtime\desktop-build\figtide.jar
        run: npm --prefix mcp run test:integration
      - name: Verify bundled executable without system Java
        run: ./scripts/test-desktop-package.ps1 -Application "dist/desktop/FigTide-$env:FIGTIDE_VERSION-windows-x64/FigTide"
      - name: Install browser for packaged acceptance
        working-directory: frontend
        run: npx playwright install chromium
      - name: Full browser acceptance against packaged EXE
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: ./scripts/test-agent.ps1 -All -Packaged -Application "dist/desktop/FigTide-$env:FIGTIDE_VERSION-windows-x64/FigTide" -FixturePort 18770
      - uses: actions/upload-artifact@v4
        with:
          name: FigTide-${{ env.FIGTIDE_VERSION }}-windows-x64
          path: dist/desktop/FigTide-${{ env.FIGTIDE_VERSION }}-windows-x64/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-package-evidence
          include-hidden-files: true
          path: |
            .runtime/desktop-package-smoke.json
            .runtime/package-smoke-*/
            backend/target/surefire-reports/
            frontend/test-results/
            frontend/playwright-report/
            .runtime/agent-e2e*.log
          if-no-files-found: warn
      - name: Prepare draft only for a tested version tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @(Get-ChildItem "dist/desktop/FigTide-$env:FIGTIDE_VERSION-windows-x64/release" -File | ForEach-Object FullName)
          Get-Content "dist/desktop/FigTide-$env:FIGTIDE_VERSION-windows-x64/release/SHA256SUMS.txt"
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## ' + [regex]::Escape($env:FIGTIDE_VERSION) + ' — [^\r\n]+\r?\n(.*?)(?=^## |\z)'
          $section = [regex]::Match($changelog, $pattern)
          if (!$section.Success -or !$section.Groups[1].Value.Trim()) { throw 'Matching CHANGELOG release notes are required.' }
          $notesFile = Join-Path $env:RUNNER_TEMP 'figtide-release-notes.md'
          [IO.File]::WriteAllText($notesFile, $section.Groups[1].Value.Trim(), [Text.UTF8Encoding]::new($false))
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw 'A published release already exists; refusing to overwrite its assets.' }
          } else {
            gh release create $tag --verify-tag --draft --title "FigTide v$env:FIGTIDE_VERSION" --notes-file $notesFile
            if ($LASTEXITCODE) { throw 'Cannot create draft release' }
          }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE) { throw 'Cannot attach draft assets' }
          gh release view $tag --json name,tagName,isDraft,url
          if ($LASTEXITCODE) { throw 'Cannot read prepared draft' }
