name: Test LabFlow
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mcp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mcp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: mvn -B -f backend/pom.xml -Pdesktop -DskipTests package
      - run: npm ci --prefix mcp
      - run: npm --prefix mcp run check
      - run: npm --prefix mcp test
      - run: npm --prefix mcp run build
      - run: npm --prefix mcp run test:integration
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-local
          MYSQL_DATABASE: labflow_test
          MYSQL_USER: labflow
          MYSQL_PASSWORD: labflow-local
        ports:
          - 33316:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -pci-root-local --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
      - name: Upload deterministic agent and review evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-replay
          path: backend/target/agent-eval/
          if-no-files-found: warn
  # 14-1-4.4：H2 后端任务（desktop 内嵌库）。不需要 MySQL service——
  # TestDatasourceInitializer 读 LABFLOW_TEST_DB=h2，走 jdbc:h2:mem 内存库和
  # db/migration-h2 迁移；MySQL 任务保持不变。
  backend-h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests on H2 (LABFLOW_TEST_DB=h2)
        env:
          LABFLOW_TEST_DB: h2
        run: mvn -B -f backend/pom.xml verify
      - name: Upload H2 agent and review evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-h2
          path: backend/target/agent-eval/
          if-no-files-found: warn
